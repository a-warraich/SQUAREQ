name: Test Notebooks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test imports
      run: |
        python -c "import sys; sys.path.append('src'); from sac import SACAgent; from environment import FixedQMetricsQuantumEnvironment; from circuits import create_quantum_circuit_from_params; print('✅ All imports work')"
    
    - name: Verify notebook structure
      run: |
        python verify_notebook.py || echo "Note: Verification script optional"

